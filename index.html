    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css?v=1.8.0">
</head>

    <!-- ===================== TODAY ===================== -->
    <div id="todayScreen" class="screen active">
        <header class="app-header">
            <div class="app-header-main">
                <p class="app-eyebrow" id="todayEyebrow">Today</p>
                <h1 class="app-title" id="todayDate">—</h1>
            </div>
            <button class="icon-button" id="syncButton" aria-label="Sync with Dropbox">
                <svg class="icon"><use href="#icon-sync"></use></svg>
            </button>
        </header>
        <div class="status-strip" id="statusStrip" hidden></div>
        <div class="screen-body" id="todayBody"></div>
    </div>

    <!-- ===================== PLAN ===================== -->
    <div id="planScreen" class="screen">
        <header class="app-header">
            <div class="app-header-main">
                <p class="app-eyebrow">The plan</p>
                <h1 class="app-title">Schedule</h1>
            </div>
        </header>
        <div class="segmented" role="tablist">
            <button class="segment active" data-range="upcoming">Upcoming</button>
            <button class="segment" data-range="past">Done</button>
            <button class="segment" data-range="all">All</button>
        </div>
        <div class="screen-body" id="planBody"></div>
    </div>

    <!-- ===================== WORKOUT DETAIL ===================== -->
    <div id="workoutScreen" class="screen">
        <header class="app-header detail">
            <button class="icon-button" data-back="true" aria-label="Back">
                <svg class="icon"><use href="#icon-back"></use></svg>
            </button>
            <div class="app-header-main">
                <p class="app-eyebrow" id="workoutEyebrow">—</p>
                <h1 class="app-title" id="workoutTitle">—</h1>
            </div>
        </header>
        <div class="screen-body" id="workoutBody"></div>
        <div class="screen-footer">
            <div class="button-row">
                <button class="btn btn-primary" id="openLogButton">Log this session</button>
                <button class="btn" id="markMissedButton">Missed</button>
            </div>
        </div>
    </div>

    <!-- ===================== LOG ===================== -->
    <div id="logScreen" class="screen">
        <header class="app-header detail">
            <button class="icon-button" data-back="true" aria-label="Back">
                <svg class="icon"><use href="#icon-back"></use></svg>
            </button>
            <div class="app-header-main">
                <p class="app-eyebrow" id="logEyebrow">—</p>
                <h1 class="app-title">How did it go?</h1>
            </div>
        </header>
        <div class="screen-body" id="logBody"></div>
        <div class="screen-footer">
            <button class="btn btn-primary btn-block" id="saveLogButton">Save to the workbook</button>
        </div>
    </div>

    <!-- ===================== ACTIVITY LIST ===================== -->
    <div id="activitiesScreen" class="screen">
        <header class="app-header detail">
            <button class="icon-button" data-back="true" aria-label="Back">
                <svg class="icon"><use href="#icon-back"></use></svg>
            </button>
            <div class="app-header-main">
                <p class="app-eyebrow">Log something else</p>
                <h1 class="app-title">Activities</h1>
            </div>
        </header>
        <div class="screen-body" id="activitiesBody"></div>
    </div>

    <!-- ===================== WAITING TO SYNC ===================== -->
    <div id="queueScreen" class="screen">
        <header class="app-header detail">
            <button class="icon-button" data-back="true" aria-label="Back">
                <svg class="icon"><use href="#icon-back"></use></svg>
            </button>
            <div class="app-header-main">
                <p class="app-eyebrow">Not yet in the workbook</p>
                <h1 class="app-title">Waiting to sync</h1>
            </div>
        </header>
        <div class="screen-body" id="queueBody"></div>
        <div class="screen-footer">
            <button class="btn btn-primary btn-block" id="queueSyncButton">Try again now</button>
        </div>
    </div>

    <!-- ===================== HOW THIS WORKS ===================== -->
    <div id="guideScreen" class="screen">
        <header class="app-header detail">
            <button class="icon-button" data-back="true" aria-label="Back">
                <svg class="icon"><use href="#icon-back"></use></svg>
            </button>
            <div class="app-header-main">
                <p class="app-eyebrow">AMS Workout Sync</p>
                <h1 class="app-title">How this works</h1>
            </div>
        </header>
        <div class="screen-body" id="guideBody"></div>
    </div>

    <!-- ===================== WHAT'S NEW ===================== -->
    <div id="versionScreen" class="screen">
        <header class="app-header detail">
            <button class="icon-button" data-back="true" aria-label="Back">
                <svg class="icon"><use href="#icon-back"></use></svg>
            </button>
            <div class="app-header-main">
                <p class="app-eyebrow" id="versionEyebrow">—</p>
                <h1 class="app-title">What's new</h1>
            </div>
        </header>
        <div class="screen-body" id="versionBody"></div>
    </div>

    <!-- ===================== SOMETHING ELSE ===================== -->
    <div id="extraScreen" class="screen">
        <header class="app-header detail">
            <button class="icon-button" data-back="true" aria-label="Back">
                <svg class="icon"><use href="#icon-back"></use></svg>
            </button>
            <div class="app-header-main">
                <p class="app-eyebrow">Not in the plan</p>
                <h1 class="app-title">Something else</h1>
            </div>
        </header>
        <div class="screen-body" id="extraBody"></div>
        <div class="screen-footer">
            <button class="btn btn-primary btn-block" id="saveExtraButton">Save it</button>
        </div>
    </div>

    <!-- ===================== RESCHEDULE ===================== -->
    <div id="rescheduleScreen" class="screen">
        <header class="app-header detail">
            <button class="icon-button" data-back="true" aria-label="Back">
                <svg class="icon"><use href="#icon-back"></use></svg>
            </button>
            <div class="app-header-main">
                <p class="app-eyebrow" id="rescheduleEyebrow">—</p>
                <h1 class="app-title">Move this session</h1>
            </div>
        </header>
        <div class="screen-body" id="rescheduleBody"></div>
    </div>

    <!-- ===================== SETTINGS ===================== -->
    <div id="settingsScreen" class="screen">
        <header class="app-header">
            <div class="app-header-main">
                <p class="app-eyebrow">AMS Workout Sync</p>
                <h1 class="app-title">Settings</h1>
            </div>
        </header>
        <div class="screen-body" id="settingsBody"></div>
    </div>

    <!-- ===================== SHEET SETUP ===================== -->
    <div id="setupScreen" class="screen">
        <header class="app-header detail">
            <button class="icon-button" data-back="true" aria-label="Back">
                <svg class="icon"><use href="#icon-back"></use></svg>
            </button>
            <div class="app-header-main">
                <p class="app-eyebrow">Which column is which</p>
                <h1 class="app-title">Sheet setup</h1>
            </div>
        </header>
        <div class="screen-body" id="setupBody"></div>
        <div class="screen-footer">
            <button class="btn btn-primary btn-block" id="saveSetupButton">Save layout</button>
        </div>
    </div>

    <nav class="tab-bar">
        <button class="tab" data-tab="today">
            <svg class="icon"><use href="#icon-today"></use></svg><span>Today</span>
        </button>
        <button class="tab" data-tab="plan">
            <svg class="icon"><use href="#icon-plan"></use></svg><span>Plan</span>
        </button>
        <button class="tab" data-tab="settings">
            <svg class="icon"><use href="#icon-settings"></use></svg><span>Settings</span>
        </button>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/version.js?v=1.8.0"></script>
    <script src="js/db.js?v=1.8.0"></script>
    <script src="js/zip.js?v=1.8.0"></script>
    <script src="js/xlsx.js?v=1.8.0"></script>
    <script src="js/mapping.js?v=1.8.0"></script>
    <script src="js/plan.js?v=1.8.0"></script>
    <script src="js/extras.js?v=1.8.0"></script>
    <script src="js/dropbox.js?v=1.8.0"></script>
    <script src="js/sync.js?v=1.8.0"></script>
    <script src="js/ui.js?v=1.8.0"></script>
    <script src="js/app.js?v=1.8.0"></script>
</body>
</html>
