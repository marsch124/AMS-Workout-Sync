<!doctype html>
<!--
  Where Dropbox sends the iPhone app's sign-in back to.

  Dropbox only returns to an address registered in its App Console, and the
  native app (AMS Workout Sync iOS) cannot be one: it has no web address. So
  this page is registered instead, and all it does is hand the answer Dropbox
  put in its address — the one-time code and the state that proves it belongs
  to the sign-in the app started — to the app's own link, amsworkoutsync://.
  The app's sign-in sheet is watching for that link and closes on it.

  It holds nothing and sends nothing anywhere else. The code is useless without
  the proof key, which never leaves the phone that asked for it. The web app
  signs in through index.html as before and never comes here.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Back to Workout Sync</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a1f1f; color: #fff;
         font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  a { display: inline-block; margin-top: 18px; padding: 14px 22px; border-radius: 14px; background: #00C97B; color: #04201a;
      font-weight: 700; text-decoration: none; }
  p { color: #a0b8b8; }
</style>
</head>
<body>
<main>
  <h1>Back to Workout Sync…</h1>
  <p id="note">If nothing happens, tap the button.</p>
  <a id="back" href="amsworkoutsync://oauth">Open Workout Sync</a>
</main>
<script>
  (function () {
    var incoming = new URLSearchParams(location.search);
    var outgoing = new URLSearchParams();
    ['code', 'state', 'error', 'error_description'].forEach(function (name) {
      var value = incoming.get(name);
      if (value !== null) outgoing.set(name, value);
    });
    var target = 'amsworkoutsync://oauth' + (outgoing.toString() ? '?' + outgoing.toString() : '');
    document.getElementById('back').href = target;
    // Take the code out of this page's own address, so it is not left in the history.
    try { history.replaceState(null, '', location.pathname); } catch (e) { /* not important */ }
    location.replace(target);
  })();
</script>
</body>
</html>
